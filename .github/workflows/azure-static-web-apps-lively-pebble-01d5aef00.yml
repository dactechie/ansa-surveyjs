name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - fcaf
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - fcaf

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_PEBBLE_01D5AEF00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          VUE_APP_AZSLOT: "staging"
          VUE_APP_LOAD_QUESTIONNAIRES_URL: "https://api.surveyjs.io/private/Surveys/getActive?accessKey=3b17209a094c4533a46ea0871c7d5be0"
          VUE_APP_SURVEY_IDS: "d422a945-a91c-417a-8826-fc13948ed790"
          VUE_APP_CLIENT_HISTORY_URL: "https://orange-smoke-027b6c100-dev.eastasia.1.azurestaticapps.net/"
          VUE_APP_GET_TABLESTORE_LOGAPP: "https://prod-05.australiaeast.logic.azure.com:443/workflows/bd761dc501c242ff8b9660bbe376f2f9/triggers/manual/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=EWT2HvlbvI393jINSYDkzTS3orRmsUpOe6B4Y4DD8fI"
          VUE_APP_UPSERT_TABLESTORE_LOGAPP: "https://prod-21.australiaeast.logic.azure.com:443/workflows/855a78dca1f0481ebdd00371040bfd06/triggers/manual/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=2siyf328zi0IXIChOKgMDTwSCY3Cqjx8Andvz1en2M8"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_PEBBLE_01D5AEF00 }}
          action: "close"
